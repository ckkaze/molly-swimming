<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molly Swimming - 梓嫣的游泳紀錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-blue-50 text-gray-800">
    <!-- Navigation Bar -->
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="text-2xl font-bold font-sans">Molly Swimming</a>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="hover:text-blue-200 transition">首頁</a>
                    <a href="events.html" class="hover:text-blue-200 transition">賽事紀錄</a>
                    <a href="records.html" class="hover:text-blue-200 transition">成績查詢與更新</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto mt-10 px-4 min-h-screen">
        <section id="hero" class="relative text-center py-32 bg-blue-900 rounded-3xl shadow-xl mb-12 overflow-hidden">
            <img src="assets/images/index_main.jpg" alt="Molly Swimming Hero" class="absolute inset-0 w-full h-full object-cover opacity-40">
            <div class="relative z-10">
                <h1 class="text-6xl font-black text-white mb-4 drop-shadow-lg">歡迎來到 Molly Swimming</h1>
                <p class="text-2xl text-blue-100 font-medium drop-shadow-md">追蹤梓嫣的每一分努力與進步</p>
            </div>
        </section>

        <!-- Extracted Content -->
        <section id="about" class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
            <div class="p-8 bg-blue-100 rounded-2xl shadow-md border border-blue-200">
                <h2 class="text-3xl font-bold text-blue-800 mb-6 flex items-center">
                    <svg class="w-8 h-8 mr-2" fill="currentColor" viewBox="0 0 20 20"><path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"></path></svg>
                    給小白教練的話
                </h2>
                <div id="coach-content" class="text-lg leading-relaxed text-gray-700 space-y-4">
                    <p class="font-medium text-blue-900">「現在就讓大家都看得到你的進步！」</p>
                    <p>不論你是幾年級的小朋友，只要跟著我的節奏，你就能跑在大家前面。讓我們一起努力，在每一個賽事中超越自我，讓大家都看見你的光芒。</p>
                    <div class="mt-6 p-4 bg-white rounded-lg border-l-4 border-blue-500 italic">
                        "你現在的進步，就是未來成功的基石。"
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-2xl overflow-hidden shadow-lg border border-gray-100 flex flex-col">
                <div class="h-80 bg-gray-200 flex items-center justify-center relative group">
                    <img src="assets/images/index_2.jpg" alt="Molly Swimming About" class="w-full h-full object-cover transition duration-500 group-hover:scale-105">
                    <div class="absolute inset-0 bg-blue-600 opacity-10 group-hover:opacity-0 transition-opacity"></div>
                </div>
                <div class="p-6">
                    <h3 class="text-xl font-bold text-gray-800 mb-2">最新賽事摘要</h3>
                    <ul class="text-gray-600 space-y-2">
                        <li>🏊 2026 夢想盃 春季 - 完美完賽</li>
                        <li>🏊 2026 基隆聯運 - 代表參賽</li>
                    </ul>
                    <a href="events.html" class="mt-4 inline-block text-blue-600 font-semibold hover:underline">查看更多賽事 →</a>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-300 py-10 mt-20">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p>&copy; 2026 Molly Swimming. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
