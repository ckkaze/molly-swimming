<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 夢想盃 春季 - Molly Swimming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .image-card:hover img { transform: scale(1.05); cursor: pointer; }
        .image-card img { transition: transform 0.5s ease; }
        
        /* Lightbox Styles */
        #lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }
        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            border: 4px solid white;
            border-radius: 8px;
        }
        #lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-blue-50 text-gray-800">
    <!-- Lightbox Overlay -->
    <div id="lightbox" onclick="closeLightbox()">
        <span id="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="">
    </div>

    <!-- Navigation Bar -->
    <nav class="bg-blue-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-4">
                    <a href="../index.html" class="text-2xl font-bold font-sans">Molly Swimming</a>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="../index.html" class="hover:text-blue-200 transition">首頁</a>
                    <a href="../events.html" class="hover:text-blue-200 transition">賽事紀錄</a>
                    <a href="../records.html" class="hover:text-blue-200 transition">成績查詢</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto mt-12 px-4 mb-24">
        <header class="text-center mb-16">
            <h1 class="text-5xl font-black text-blue-900 mb-4">2025 夢想盃 春季</h1>
            <div class="w-24 h-1 bg-blue-500 mx-auto"></div>
            <p class="mt-6 text-xl text-gray-600">March 2025</p>
        </header>

        <!-- Gallery Section -->
        <section class="mb-24">
            <div class="flex justify-between items-end mb-8 border-l-8 border-blue-600 pl-4">
                <h2 class="text-3xl font-bold text-gray-800">賽事相簿</h2>
                <p class="text-gray-500 text-sm">點擊照片可放大查看</p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <div class="image-card rounded-2xl overflow-hidden shadow-lg h-64 bg-white" onclick="openLightbox(this)">
                    <img src="../assets/images/event_2025_dreamcup_spring/PXL_20250307_230436315.jpg" class="w-full h-full object-cover">
                </div>
                <div class="image-card rounded-2xl overflow-hidden shadow-lg h-64 bg-white" onclick="openLightbox(this)">
                    <img src="../assets/images/event_2025_dreamcup_spring/PXL_20250308_043845764.jpg" class="w-full h-full object-cover">
                </div>
                <div class="image-card rounded-2xl overflow-hidden shadow-lg h-64 bg-white" onclick="openLightbox(this)">
                    <img src="../assets/images/event_2025_dreamcup_spring/PXL_20250308_054658312.jpg" class="w-full h-full object-cover">
                </div>
                <div class="image-card rounded-2xl overflow-hidden shadow-lg h-64 bg-white" onclick="openLightbox(this)">
                    <img src="../assets/images/event_2025_dreamcup_spring/PXL_20250308_054713408.jpg" class="w-full h-full object-cover">
                </div>
                <div class="image-card rounded-2xl overflow-hidden shadow-lg h-64 bg-white" onclick="openLightbox(this)">
                    <img src="../assets/images/event_2025_dreamcup_spring/PXL_20250308_091644266.jpg" class="w-full h-full object-cover">
                </div>
                <div class="image-card rounded-2xl overflow-hidden shadow-lg h-64 bg-white" onclick="openLightbox(this)">
                    <img src="../assets/images/event_2025_dreamcup_spring/PXL_20250308_092211620.jpg" class="w-full h-full object-cover">
                </div>
                <div class="image-card rounded-2xl overflow-hidden shadow-lg h-64 bg-white" onclick="openLightbox(this)">
                    <img src="../assets/images/event_2025_dreamcup_spring/PXL_20250308_092615540.MP.jpg" class="w-full h-full object-cover">
                </div>
                <div class="image-card rounded-2xl overflow-hidden shadow-lg h-64 bg-white" onclick="openLightbox(this)">
                    <img src="../assets/images/event_2025_dreamcup_spring/PXL_20250309_061236331.MP.jpg" class="w-full h-full object-cover">
                </div>
                <div class="image-card rounded-2xl overflow-hidden shadow-lg h-64 bg-white" onclick="openLightbox(this)">
                    <img src="../assets/images/event_2025_dreamcup_spring/PXL_20250309_061303092.jpg" class="w-full h-full object-cover">
                </div>
                <div class="image-card rounded-2xl overflow-hidden shadow-lg h-64 bg-white" onclick="openLightbox(this)">
                    <img src="../assets/images/event_2025_dreamcup_spring/PXL_20250309_064323582.jpg" class="w-full h-full object-cover">
                </div>
                <div class="image-card rounded-2xl overflow-hidden shadow-lg h-64 bg-white" onclick="openLightbox(this)">
                    <img src="../assets/images/event_2025_dreamcup_spring/PXL_20250309_064341146.jpg" class="w-full h-full object-cover">
                </div>
            </div>
        </section>

        <!-- Results Section -->
        <section class="mb-16">
            <h2 class="text-3xl font-bold text-gray-800 mb-8 border-l-8 border-blue-600 pl-4">成績總結</h2>
            <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
                <div class="overflow-x-auto">
                    <table class="min-w-full leading-normal">
                        <thead>
                            <tr class="bg-blue-600 text-white">
                                <th class="px-5 py-3 border-b-2 border-gray-200 text-left text-sm font-semibold uppercase tracking-wider">日期</th>
                                <th class="px-5 py-3 border-b-2 border-gray-200 text-left text-sm font-semibold uppercase tracking-wider">項目</th>
                                <th class="px-5 py-3 border-b-2 border-gray-200 text-left text-sm font-semibold uppercase tracking-wider">成績</th>
                                <th class="px-5 py-3 border-b-2 border-gray-200 text-left text-sm font-semibold uppercase tracking-wider">備註</th>
                            </tr>
                        </thead>
                        <tbody id="records-body">
                            <tr>
                                <td colspan="4" class="px-5 py-10 text-center text-gray-500 italic">正在載入成績資料...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Back Button -->
        <div class="text-center">
            <a href="../events.html" class="inline-flex items-center text-blue-600 font-bold hover:text-blue-800 transition">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                返回賽事紀錄列表
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 py-12">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="mb-4">&copy; 2026 Molly Swimming. Created for Molly's Journey.</p>
        </div>
    </footer>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzHyxGXTpoxYrQP_wwOBj15-LmMJ9P-Esh15MROo3yiD6yCm8H2BwkmxK4mJ4pT9PnU/exec';
        const EVENT_NAME = '2025 夢想盃 春季';

        async function loadRecords() {
            const body = document.getElementById('records-body');
            try {
                const response = await fetch(GAS_URL);
                const result = await response.json();
                
                if (result.status === 'success') {
                    const filtered = result.data.filter(item => (item.賽事 || '') === EVENT_NAME);
                    renderTable(filtered);
                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                console.error('Load error:', err);
                body.innerHTML = `<tr><td colspan="4" class="px-5 py-10 text-center text-red-500">資料載入失敗</td></tr>`;
            }
        }

        function renderTable(data) {
            const body = document.getElementById('records-body');
            body.innerHTML = '';
            
            if (data.length === 0) {
                body.innerHTML = `<tr><td colspan="4" class="px-5 py-10 text-center text-gray-400 italic">查無本場賽事成績紀錄</td></tr>`;
                return;
            }

            data.sort((a, b) => new Date(b.日期) - new Date(a.日期));

            data.forEach(item => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-blue-50 transition-colors border-b border-gray-100';
                row.innerHTML = `
                    <td class="px-5 py-4 text-sm font-medium text-gray-900">${formatDate(item.日期)}</td>
                    <td class="px-5 py-4 text-sm text-gray-700">${item.項目 || ''}</td>
                    <td class="px-5 py-4 text-sm font-bold text-blue-600 font-mono">${item.成績 || ''}</td>
                    <td class="px-5 py-4 text-sm text-gray-500 italic">${item.備註 || '-'}</td>
                `;
                body.appendChild(row);
            });
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return isNaN(d) ? dateStr : d.toLocaleDateString('zh-TW');
        }

        // Lightbox Functions
        function openLightbox(element) {
            const imgSrc = element.querySelector('img').src;
            document.getElementById('lightbox-img').src = imgSrc;
            document.getElementById('lightbox').style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Disable scrolling
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.body.style.overflow = 'auto'; // Re-enable scrolling
        }

        window.onload = loadRecords;
    </script>
</body>
</html>
