<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成績查詢與更新 - Molly Swimming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-blue-50 text-gray-800">
    <!-- Navigation Bar -->
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="text-2xl font-bold font-sans">Molly Swimming</a>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="hover:text-blue-200 transition">首頁</a>
                    <a href="events.html" class="hover:text-blue-200 transition">賽事紀錄</a>
                    <a href="records.html" class="text-blue-200 font-bold">成績查詢與更新</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto mt-10 px-4 mb-20">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8">
            <h1 class="text-4xl font-bold text-blue-800">梓嫣游泳成績紀錄系統</h1>
            <button onclick="document.getElementById('addModal').classList.remove('hidden')" class="mt-4 md:mt-0 bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-full shadow-lg transition transform hover:scale-105 flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                新增成績紀錄
            </button>
        </div>

        <!-- Filter Section -->
        <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-200 mb-8 flex flex-col md:flex-row gap-4 items-end">
            <div class="flex-1 w-full">
                <label class="block text-sm font-semibold text-gray-600 mb-2">篩選賽事</label>
                <input type="text" id="filter-event" placeholder="輸入關鍵字..." class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="flex-1 w-full">
                <label class="block text-sm font-semibold text-gray-600 mb-2">篩選項目</label>
                <input type="text" id="filter-subject" placeholder="輸入關鍵字..." class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <button onclick="applyFilters()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700 transition">搜尋</button>
            <button onclick="resetFilters()" class="text-gray-500 hover:text-gray-700 px-2 py-2">重置</button>
        </div>

        <!-- Data Table Container -->
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="min-w-full leading-normal">
                    <thead>
                        <tr class="bg-blue-600 text-white select-none">
                            <th onclick="handleSort('日期')" class="cursor-pointer px-5 py-3 border-b-2 border-gray-200 text-left text-sm font-semibold uppercase tracking-wider hover:bg-blue-700 transition">
                                日期 <span id="sort-日期"></span>
                            </th>
                            <th onclick="handleSort('賽事')" class="cursor-pointer px-5 py-3 border-b-2 border-gray-200 text-left text-sm font-semibold uppercase tracking-wider hover:bg-blue-700 transition">
                                賽事 <span id="sort-賽事"></span>
                            </th>
                            <th onclick="handleSort('項目')" class="cursor-pointer px-5 py-3 border-b-2 border-gray-200 text-left text-sm font-semibold uppercase tracking-wider hover:bg-blue-700 transition">
                                項目 <span id="sort-項目"></span>
                            </th>
                            <th onclick="handleSort('成績')" class="cursor-pointer px-5 py-3 border-b-2 border-gray-200 text-left text-sm font-semibold uppercase tracking-wider hover:bg-blue-700 transition">
                                成績 <span id="sort-成績"></span>
                            </th>
                            <th class="px-5 py-3 border-b-2 border-gray-200 text-left text-sm font-semibold uppercase tracking-wider">
                                備註
                            </th>
                        </tr>
                    </thead>
                    <tbody id="records-body">
                        <!-- Data will be injected here via JavaScript -->
                        <tr>
                            <td colspan="5" class="px-5 py-10 text-center text-gray-500 italic">正在從雲端載入成績資料...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Add Record Modal -->
    <div id="addModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl transform transition-all mx-4">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">新增游泳成績</h2>
                <button onclick="document.getElementById('addModal').classList.add('hidden')" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <form id="recordForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">日期</label>
                    <input type="date" id="form-date" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">賽事名稱</label>
                    <input type="text" id="form-event" placeholder="例如：2025 夢想盃" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">游泳項目</label>
                    <input type="text" id="form-subject" placeholder="例如：50公尺 自由式" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">成績</label>
                    <input type="text" id="form-time" placeholder="例如：00:45.12" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">備註</label>
                    <textarea id="form-note" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border"></textarea>
                </div>
                <div class="pt-4 flex space-x-3">
                    <button type="button" onclick="document.getElementById('addModal').classList.add('hidden')" class="flex-1 bg-gray-200 text-gray-800 py-3 rounded-xl font-bold hover:bg-gray-300">取消</button>
                    <button type="submit" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 shadow-lg">確認送出</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-300 py-10 mt-auto">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p>&copy; 2026 Molly Swimming. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        // 設定您的 GAS Web App URL
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzHyxGXTpoxYrQP_wwOBj15-LmMJ9P-Esh15MROo3yiD6yCm8H2BwkmxK4mJ4pT9PnU/exec';

        let allRecords = []; // 儲存所有原始資料
        let currentSort = { column: '日期', direction: 'desc' }; // 目前排序狀態

        // 處理表單送出 (POST)
        document.getElementById('recordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = '傳送中...';

            const data = {
                "日期": document.getElementById('form-date').value,
                "賽事": document.getElementById('form-event').value,
                "項目": document.getElementById('form-subject').value,
                "成績": document.getElementById('form-time').value,
                "備註": document.getElementById('form-note').value
            };

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(data),
                });
                
                alert('資料已成功寫入！');
                document.getElementById('addModal').classList.add('hidden');
                e.target.reset();
                setTimeout(loadRecords, 1500); 
            } catch (err) {
                console.error('Submit error:', err);
                alert('傳送資料時發生錯誤，請檢查 GAS 權限設定。');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '確認送出';
            }
        });

        // 載入資料 (GET)
        async function loadRecords() {
            const body = document.getElementById('records-body');
            try {
                const response = await fetch(GAS_URL);
                const result = await response.json();
                
                if (result.status === 'success') {
                    allRecords = result.data;
                    applyFilters(); // 初始載入並套用過濾與排序
                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                console.error('Load error:', err);
                body.innerHTML = `<tr><td colspan="5" class="px-5 py-10 text-center text-red-500 font-bold">資料載入失敗：${err.message}<br><small>請確認您已正確部署 GAS 並開啟「任何人」存取權限</small></td></tr>`;
            }
        }

        // 套用過濾與排序
        function applyFilters() {
            const eventFilter = document.getElementById('filter-event').value.toLowerCase();
            const subjectFilter = document.getElementById('filter-subject').value.toLowerCase();

            // 1. 過濾
            let filtered = allRecords.filter(item => {
                const matchEvent = (item.賽事 || '').toLowerCase().includes(eventFilter);
                const matchSubject = (item.項目 || '').toLowerCase().includes(subjectFilter);
                return matchEvent && matchSubject;
            });

            // 2. 排序
            filtered.sort((a, b) => {
                let valA = a[currentSort.column] || '';
                let valB = b[currentSort.column] || '';

                // 針對日期與成績特殊處理
                if (currentSort.column === '日期') {
                    valA = new Date(valA);
                    valB = new Date(valB);
                }

                if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
                return 0;
            });

            renderTable(filtered);
            updateSortIcons();
        }

        // 渲染表格
        function renderTable(data) {
            const body = document.getElementById('records-body');
            body.innerHTML = '';
            
            if (data.length === 0) {
                body.innerHTML = `<tr><td colspan="5" class="px-5 py-10 text-center text-gray-400 italic">查無符合條件的資料</td></tr>`;
                return;
            }

            data.forEach(item => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-blue-50 transition-colors border-b border-gray-100';
                row.innerHTML = `
                    <td class="px-5 py-4 text-sm font-medium text-gray-900">${formatDate(item.日期)}</td>
                    <td class="px-5 py-4 text-sm text-gray-700">${item.賽事 || ''}</td>
                    <td class="px-5 py-4 text-sm text-gray-700">${item.項目 || ''}</td>
                    <td class="px-5 py-4 text-sm font-bold text-blue-600 font-mono">${item.成績 || ''}</td>
                    <td class="px-5 py-4 text-sm text-gray-500 italic">${item.備註 || '-'}</td>
                `;
                body.appendChild(row);
            });
        }

        // 處理排序點擊
        function handleSort(column) {
            if (currentSort.column === column) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = column;
                currentSort.direction = 'asc';
            }
            applyFilters();
        }

        // 更新排序圖示
        function updateSortIcons() {
            ['日期', '賽事', '項目', '成績'].forEach(col => {
                const el = document.getElementById(`sort-${col}`);
                if (currentSort.column === col) {
                    el.innerHTML = currentSort.direction === 'asc' ? ' ▲' : ' ▼';
                    el.className = 'text-blue-200 font-bold';
                } else {
                    el.innerHTML = ' ⇅';
                    el.className = 'text-blue-300 opacity-50';
                }
            });
        }

        function resetFilters() {
            document.getElementById('filter-event').value = '';
            document.getElementById('filter-subject').value = '';
            applyFilters();
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return isNaN(d) ? dateStr : d.toLocaleDateString('zh-TW');
        }

        window.onload = loadRecords;
    </script>
</body>
</html>
